<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern web application with fast loading and responsive design for enhanced user experience">
    <meta name="keywords" content="web application, performance, responsive design">
    <meta name="author" content="App Team">

    <!-- Critical meta tags for SEO -->
    <title>Fast Web App - Responsive & Optimized</title>
    <link rel="canonical" href="https://yourapp.vercel.app/">

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Critical CSS inlined for fastest first paint -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            text-align: center;
            color: white;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            margin-bottom: 2rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .cta-button {
            padding: 16px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.8s ease-out 0.4s both;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .features-section {
            background: white;
            padding: 4rem 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            margin: 0 auto 1rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .hero-section {
                min-height: 70vh;
                padding: 2rem 1rem;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 1.75rem;
            }

            .cta-button {
                width: 100%;
                max-width: 280px;
            }
        }

        /* Animations optimized for performance */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>

    <!-- JSON-LD structured data for SEO -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fast Web App",
        "description": "High-performance web application with responsive design",
        "url": "https://yourapp.vercel.app/",
        "publisher": {
            "@type": "Organization",
            "name": "App Team"
        }
    }
    </script>
</head>
<body>
    <!-- Above-the-fold content inlined for fastest render -->
    <section class="hero-section">
        <div class="container">
            <h1 class="hero-title">Welcome to Fast Web App</h1>
            <p class="hero-subtitle">Experience lightning-fast performance with responsive design</p>
            <a href="#features" class="cta-button">Get Started Now</a>
        </div>
    </section>

    <section id="features" class="features-section">
        <div class="container">
            <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2.5rem;">Features</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon"></div>
                    <h3>Fast Performance</h3>
                    <p>Optimized for speed with inlined critical resources</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon"></div>
                    <h3>Responsive Design</h3>
                    <p>Looks great on all devices and screen sizes</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon"></div>
                    <h3>SEO Optimized</h3>
                    <p>Boost your search engine rankings</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Non-critical JS loaded asynchronously -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        // Smooth scroll for CTA
        document.querySelector('.cta-button').addEventListener('click', (e) => {
            e.preventDefault();
            const featuresSection = document.getElementById('features');
            featuresSection.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
