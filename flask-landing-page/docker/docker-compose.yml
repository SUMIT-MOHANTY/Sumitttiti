version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=development
    volumes:
      - ../backend:/app/backend
      - ../templates:/app/templates
      - ../static:/app/static
    restart: unless-stopped
