<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Interaction Demo</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }
        .hero-content { text-align: center; }
        .hero-cta {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            margin: 10px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }
        .hero-cta:hover { background: rgba(255,255,255,0.3); }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }
        #content { height: 100vh; padding: 50px; }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="hero-content">
            <h1>Welcome to Our Platform</h1>
            <p>Experience the future of web interactions</p>
            <a href="#features" class="hero-cta">Explore Features</a>
            <a href="#contact" class="hero-cta">Get Started</a>
        </div>
    </section>

    <div id="content">
        <h2 id="features">Features</h2>
        <p>This is where your content goes...</p>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
